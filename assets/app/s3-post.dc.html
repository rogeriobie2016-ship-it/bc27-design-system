<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="../css/fonts.css" rel="stylesheet">
<script src="../js/image-slot.js"></script>
</helmet>
<div style="position:relative;width:{{ dw }}px;height:{{ dh }}px;overflow:hidden;border-radius:6px">
<div style="position:absolute;left:0;top:0;width:{{ W }}px;height:{{ H }}px;transform:scale({{ esc }});transform-origin:0 0;overflow:hidden;background:{{ pal.bg }};font-family:'Bricolage Grotesque',sans-serif">

<sc-if value="{{ lTema }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;left:0;top:0;width:100%;height:{{ topH }}px;overflow:hidden">
<sc-if value="{{ eMask }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;background:{{ pal.pat }};mask:url({{ eUrl }}) 0 0/{{ eT }}px auto {{ eRep }}"></div></sc-if>
<sc-if value="{{ eBand }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ bandRows }}" as="r" hint-placeholder-count="0"><div style="position:absolute;left:-2%;width:104%;top:{{ r.top }}px;transform:rotate({{ r.rot }}deg);display:flex;gap:{{ r.gap }}px;border-top:5px solid {{ pal.pat }};padding:0 {{ r.gap }}px"><sc-for list="{{ r.flags }}" as="f" hint-placeholder-count="0"><div style="flex:none;width:{{ r.fw }}px;height:{{ r.fh }}px;background:{{ f }};clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)"></div></sc-for></div></sc-for></sc-if>
</div>
<div style="position:absolute;left:0;top:{{ topH }}px;width:100%;bottom:0;background:{{ pal.block }}"></div>
<div style="position:absolute;left:{{ padX }}px;right:{{ padX }}px;top:{{ kY }}px;font-weight:700;font-size:{{ kfs }}px;letter-spacing:.2em;color:{{ pal.title }};text-align:{{ talign }}">{{ kicker }}</div>
<div style="position:absolute;left:{{ padX }}px;right:{{ padX }}px;top:{{ tY }}px;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:{{ fs }}px;line-height:.9;letter-spacing:{{ trk }}em;color:{{ pal.title }};text-align:{{ talign }};text-wrap:balance">{{ titulo }}</div>
<div style="position:absolute;left:{{ padX }}px;right:{{ padX }}px;top:{{ sY }}px;font-weight:600;font-stretch:{{ larg }}%;font-size:{{ sfs }}px;line-height:1.25;color:{{ pal.title }};text-align:{{ talign }};text-wrap:pretty;opacity:.9">{{ texto }}</div>
</sc-if>

<sc-if value="{{ lMosaico }}" hint-placeholder-val="{{ false }}">
<sc-for list="{{ tiles }}" as="t" hint-placeholder-count="0"><div style="position:absolute;left:{{ t.x }}px;top:{{ t.y }}px;width:{{ t.w }}px;height:{{ t.h }}px;background:{{ t.bg }};overflow:hidden"><div style="position:absolute;inset:{{ t.in }}px;background:{{ t.fg }};mask:url({{ t.u }}) {{ t.ms }}"></div></div></sc-for>
<div style="position:absolute;left:0;top:{{ mY }}px;width:100%;height:{{ mH }}px;background:{{ pal.block }};display:flex;align-items:center;justify-content:center;padding:0 {{ padX }}px;box-sizing:border-box"><span style="font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:{{ mfs }}px;line-height:.9;letter-spacing:{{ trk }}em;color:{{ pal.title }};text-align:center;text-wrap:balance">{{ titulo }}</span></div>
</sc-if>

<sc-if value="{{ lCordel }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:{{ pal.pat }};opacity:.18;mask:url(../img/f2/hachura.svg) 0 0/70px auto repeat"></div>
<div style="position:absolute;left:0;top:0;width:100%;height:44px;background:{{ pal.pat }};mask:url(../img/f2/serrilha.svg) 0 0/58px 44px repeat-x"></div>
<div style="position:absolute;left:0;bottom:0;width:100%;height:44px;background:{{ pal.pat }};transform:scaleY(-1);mask:url(../img/f2/serrilha.svg) 0 0/58px 44px repeat-x"></div>
<div style="position:absolute;left:{{ cdX }}px;right:{{ cdX }}px;top:{{ cdY }}px;bottom:{{ cdY }}px;border:10px solid {{ pal.pat }};padding:40px;display:flex;flex-direction:column;align-items:center;gap:26px;background:{{ pal.bg }}">
<div style="font-weight:700;font-size:{{ kfs }}px;letter-spacing:.24em;color:{{ pal.pat }}">{{ kicker }}</div>
<div style="width:100%;flex:1;position:relative;min-height:0"><image-slot id="{{ slotId }}" shape="rect" src="../img/fotos/fernanda.jpg" placeholder="Xilogravura / ilustração"></image-slot></div>
<div style="font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:{{ cfs }}px;line-height:.9;letter-spacing:{{ trk }}em;text-align:center;color:{{ pal.pat }};text-wrap:balance">{{ titulo }}</div>
<div style="font-weight:600;font-size:{{ sfs }}px;color:{{ pal.pat }};text-align:center">{{ texto }}</div>
</div>
</sc-if>

<sc-if value="{{ lPalestrante }}" hint-placeholder-val="{{ false }}">
<sc-if value="{{ eMask }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;background:{{ pal.pat }};opacity:.55;mask:url({{ eUrl }}) 0 0/{{ eT }}px auto {{ eRep }}"></div></sc-if>
<div style="position:absolute;left:0;right:0;top:{{ kY }}px;text-align:center;font-weight:700;font-size:{{ kfs }}px;letter-spacing:.22em;color:{{ pal.kick }}">{{ kicker }}</div>
<div style="position:absolute;left:{{ phX }}px;top:{{ phY }}px;width:{{ phW }}px;height:{{ phH }}px">
<sc-if value="{{ fSelo }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:radial-gradient(circle at 12px 12px,transparent 8px,#FFFFFF 8.5px) -12px -12px/24px 24px;filter:drop-shadow(0 16px 20px rgba(0,0,0,.2))"></div></sc-if>
<div style="position:absolute;inset:{{ phIn }}px;border-radius:{{ phR }};overflow:hidden;background:#FFFFFF;box-shadow:0 0 0 {{ phB }}px {{ phBc }}"><image-slot id="{{ slotId }}" shape="rect" src="../img/fotos/lana.jpg" placeholder="Foto"></image-slot></div>
</div>
<div style="position:absolute;left:0;right:0;top:{{ nY }}px;display:flex;flex-direction:column;align-items:center;gap:16px">
<div style="background:{{ pal.block }};padding:10px 44px 18px;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:{{ nfs }}px;letter-spacing:{{ trk }}em;line-height:1;color:{{ pal.title }};white-space:nowrap">{{ nome }}</div>
<div style="background:#FFFFFF;padding:12px 30px;font-weight:600;font-stretch:{{ larg }}%;font-size:{{ rfs }}px;color:#0D3A85;white-space:nowrap">{{ cargo }}</div>
</div>
</sc-if>

<sc-if value="{{ lRegiao }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:{{ padX }}px;top:{{ kY }}px;font-weight:700;font-size:{{ kfs }}px;letter-spacing:.2em;color:{{ pal.kick }}">{{ kicker }}</div>
<div style="position:absolute;left:{{ padX }}px;right:{{ padX }}px;top:{{ tY }}px;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:{{ fs }}px;line-height:.9;letter-spacing:{{ trk }}em;color:{{ pal.block }};text-wrap:balance">{{ titulo }}</div>

<div style="position:absolute;left:0;bottom:0;width:100%;height:{{ footH }}px;background:{{ pal.block }}"></div>
</sc-if>

<sc-if value="{{ lCitacao }}" hint-placeholder-val="{{ false }}">

<div style="position:absolute;left:0;bottom:0;width:100%;height:{{ stripH }}px;background:{{ pal.block }};overflow:hidden"><sc-if value="{{ eMask }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;background:{{ pal.bg }};mask:url({{ eUrl }}) 0 0/{{ eT }}px auto {{ eRep }}"></div></sc-if></div>
</sc-if>

<sc-if value="{{ lContagem }}" hint-placeholder-val="{{ false }}">
<sc-if value="{{ eMask }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:0;top:0;width:100%;height:{{ stripH }}px;background:{{ pal.pat }};mask:url({{ eUrl }}) 0 0/{{ eT }}px auto {{ eRep }}"></div></sc-if>
<div style="position:absolute;left:0;right:0;top:{{ kY }}px;text-align:center;font-weight:700;font-size:{{ kfs2 }}px;letter-spacing:.3em;color:{{ pal.kick }}">{{ kicker }}</div>
<div style="position:absolute;left:0;right:0;top:{{ numY }}px;text-align:center;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:{{ numFs }}px;line-height:.85;letter-spacing:-.05em;color:{{ pal.block }}">{{ numero }}</div>
<div style="position:absolute;left:{{ padX }}px;right:{{ padX }}px;top:{{ capY }}px;text-align:center;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:{{ capFs }}px;line-height:.95;letter-spacing:{{ trk }}em;color:{{ pal.kick }};text-wrap:balance">{{ titulo }}</div>
</sc-if>

<sc-if value="{{ assinatura }}" hint-placeholder-val="{{ true }}"><img src="../img/wm-{{ wm }}.png" style="position:absolute;left:{{ wmX }}px;top:{{ wmY }}px;width:{{ wmW }}px"></sc-if>

<sc-if value="{{ aPill }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;right:{{ padX }}px;top:{{ adY }}px;transform:rotate(-5deg);background:{{ adBg }};color:{{ adC }};border:8px solid #FFFFFF;border-radius:999px;padding:14px 36px;font-weight:800;font-size:{{ adFs }}px;letter-spacing:-.01em;white-space:nowrap;box-shadow:0 12px 16px rgba(0,0,0,.3)">{{ adTxt1 }} {{ adTxt2 }}</div></sc-if>
<div style="position:absolute;inset:0;background:url(../img/papel.png) 0 0/700px,url(../img/grao.png) 0 0/300px;opacity:{{ tx }};pointer-events:none"></div><sc-if value="{{ gr2.on }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:{{ gr2.bg }};mix-blend-mode:{{ gr2.bl }};opacity:{{ gr2.o }};pointer-events:none"></div></sc-if><sc-if value="{{ tx2.on }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:{{ tx2.bg }};mix-blend-mode:{{ tx2.bl }};opacity:{{ tx2.o }};pointer-events:none"></div></sc-if>
</div>
</div>
</x-dc>
