<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/dc-runtime.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:{{ dw }}px;height:{{ dh }}px;overflow:hidden;border-radius:6px">
<div style="position:absolute;left:0;top:0;width:{{ W }}px;height:{{ H }}px;transform:scale({{ esc }});transform-origin:0 0;overflow:hidden;background:{{ bg }}">
<sc-if value="{{ isMask }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:-50%;top:-50%;width:200%;height:200%;transform:rotate({{ rot }}deg)"><div ref="{{ driftRef }}" style="position:absolute;inset:0;width:calc(100% + {{ tile }}px);background:{{ fg }};opacity:{{ op }};mask:url({{ url }}) 0 0/{{ tile }}px auto {{ rep }}"></div></div></sc-if>
<sc-if value="{{ isAthos }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ tiles }}" as="t" hint-placeholder-count="0"><div style="position:absolute;left:{{ t.x }}px;top:{{ t.y }}px;width:{{ t.s }}px;height:{{ t.s }}px;transform:rotate({{ t.r }}deg);background:radial-gradient(circle at 0 0,{{ t.a }} 0 62%,transparent 62.5%),radial-gradient(circle at 100% 100%,{{ t.b }} 0 22%,transparent 22.5%);opacity:{{ op }}"></div></sc-for></sc-if>
<sc-if value="{{ isBand }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="0"><div style="position:absolute;left:-2%;width:104%;top:{{ r.top }}px;transform:rotate({{ r.rot }}deg);display:flex;gap:{{ r.gap }}px;border-top:5px solid {{ fg }};padding:0 {{ r.gap }}px"><sc-for list="{{ r.flags }}" as="f" hint-placeholder-count="0"><div style="flex:none;width:{{ r.fw }}px;height:{{ r.fh }}px;background:{{ f }};clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)"></div></sc-for></div></sc-for></sc-if>
<sc-if value="{{ isFrevo }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ umbs }}" as="u" hint-placeholder-count="0"><div style="position:absolute;left:{{ u.x }}px;top:{{ u.y }}px;width:{{ u.s }}px;height:{{ u.s }}px;border-radius:50%;background:conic-gradient(#FBF99D 0 12.5%,#0A7BE5 0 25%,#FFFFFF 0 37.5%,#15E888 0 50%,#FBF99D 0 62.5%,#0A7BE5 0 75%,#FFFFFF 0 87.5%,#15E888 0);box-shadow:0 0 0 {{ u.b }}px {{ bg }},0 0 0 {{ u.b2 }}px {{ fg }};opacity:{{ op }}"></div></sc-for></sc-if>
<div style="position:absolute;inset:0;background:url(../img/papel.png) 0 0/700px,url(../img/grao.png) 0 0/300px;opacity:{{ tx }};pointer-events:none"></div><sc-if value="{{ gr2.on }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:{{ gr2.bg }};mix-blend-mode:{{ gr2.bl }};opacity:{{ gr2.o }};pointer-events:none"></div></sc-if><sc-if value="{{ tx2.on }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:{{ tx2.bg }};mix-blend-mode:{{ tx2.bl }};opacity:{{ tx2.o }};pointer-events:none"></div></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:360},&quot;elemento&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cobogo&quot;,&quot;azulejo&quot;,&quot;calcadao&quot;,&quot;fuxico&quot;,&quot;hachura&quot;,&quot;ondas&quot;,&quot;alvorada&quot;,&quot;estrelas&quot;,&quot;asterisco&quot;,&quot;serrilha&quot;,&quot;athos&quot;,&quot;bandeirinhas&quot;,&quot;frevo&quot;],&quot;default&quot;:&quot;cobogo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Padrão&quot;},&quot;corFundo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;verde&quot;,&quot;folha&quot;,&quot;vivo&quot;,&quot;amarelo&quot;,&quot;azul&quot;,&quot;noite&quot;,&quot;branco&quot;,&quot;papel&quot;],&quot;default&quot;:&quot;verde&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Cores&quot;},&quot;corPadrao&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;verde&quot;,&quot;folha&quot;,&quot;vivo&quot;,&quot;amarelo&quot;,&quot;azul&quot;,&quot;noite&quot;,&quot;branco&quot;,&quot;papel&quot;],&quot;default&quot;:&quot;vivo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Cores&quot;},&quot;escala&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.3,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Padrão&quot;},&quot;rotacao&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:-45,&quot;max&quot;:45,&quot;step&quot;:1,&quot;default&quot;:0,&quot;unit&quot;:&quot;°&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Padrão&quot;},&quot;opacidade&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.1,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Padrão&quot;},&quot;animar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Movimento&quot;},&quot;velocidade&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.25,&quot;max&quot;:3,&quot;step&quot;:0.25,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Movimento&quot;},&quot;textura&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhuma&quot;,&quot;sutil&quot;,&quot;media&quot;,&quot;forte&quot;],&quot;default&quot;:&quot;sutil&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Saída&quot;},&quot;formato&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1:1&quot;,&quot;16:9&quot;,&quot;9:16&quot;,&quot;4:5&quot;,&quot;3:1&quot;],&quot;default&quot;:&quot;1:1&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Saída&quot;},&quot;largura&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:360,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Saída&quot;},&quot;texturaExtra&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhuma&quot;,&quot;ruído&quot;,&quot;ruído forte&quot;,&quot;papel&quot;,&quot;papel + ruído&quot;,&quot;meio-tom&quot;,&quot;linho&quot;,&quot;linhas de tv&quot;],&quot;default&quot;:&quot;nenhuma&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Textura e gradiente&quot;},&quot;texturaForca&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;default&quot;:45,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Textura e gradiente&quot;},&quot;gradiente&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhum&quot;,&quot;luz suave&quot;,&quot;profundidade&quot;,&quot;brilho dourado&quot;,&quot;mata para céu&quot;,&quot;aurora&quot;,&quot;noite&quot;,&quot;vinheta&quot;],&quot;default&quot;:&quot;nenhum&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Textura e gradiente&quot;},&quot;gradienteForca&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;default&quot;:100,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Textura e gradiente&quot;}}">
const C = { verde:'#0B5E37', folha:'#1A8A52', vivo:'#15E888', amarelo:'#FBF99D', azul:'#0A7BE5', noite:'#0D3A85', branco:'#FFFFFF', papel:'#F5F4EC' };
const FMT = { '1:1':[1080,1080], '16:9':[1920,1080], '9:16':[1080,1920], '4:5':[1080,1350], '3:1':[3240,1080] };
const M = { cobogo:['../img/f2/cobogo.svg',.15,'repeat'], azulejo:['../img/f2/azulejo.svg',.16,'repeat'], calcadao:['../img/f2/calcadao.svg',.3,'repeat'], fuxico:['../img/f2/fuxico.svg',.13,'repeat'], hachura:['../img/f2/hachura.svg',.09,'repeat'], ondas:['../img/f/onda-linha.svg',.22,'repeat'], alvorada:['../img/f2/alvorada.svg',.15,'repeat'], estrelas:['../img/f/estrela8.svg',.12,'repeat'], asterisco:['../img/f/asterisco.svg',.1,'repeat'], serrilha:['../img/f2/serrilha.svg',.06,'repeat'] };
const COLS = ['#FBF99D','#0A7BE5','#FFFFFF','#15E888','#0D3A85','#0B5E37'];
const TEXS = { ruído:['url(../img/grao.png) 0 0/420px 420px repeat','overlay'], 'ruído forte':['url(../img/grao.png) 0 0/220px 220px repeat','multiply'], papel:['url(../img/papel.png) center/cover','multiply'], 'meio-tom':['radial-gradient(rgba(0,0,0,.55) 1.3px, transparent 1.8px) 0 0/11px 11px','soft-light'], linho:['repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 1px, transparent 1px 4px)','overlay'], 'linhas de tv':['repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 2px, transparent 2px 6px)','multiply'], 'papel + ruído':['url(../img/grao.png) 0 0/320px 320px repeat, url(../img/papel.png) center/cover','multiply'] };
const GRADS = { 'luz suave':['radial-gradient(120% 80% at 15% 0%, rgba(255,255,255,.45), transparent 62%)','soft-light'], profundidade:['linear-gradient(180deg, transparent 35%, rgba(0,0,0,.5))','multiply'], 'brilho dourado':['radial-gradient(90% 70% at 85% 8%, rgba(251,249,157,.6), transparent 65%)','screen'], 'mata para céu':['linear-gradient(160deg, rgba(21,232,136,.5), rgba(10,123,229,.5))','overlay'], aurora:['radial-gradient(60% 50% at 18% 82%, rgba(21,232,136,.55), transparent 70%), radial-gradient(60% 50% at 82% 18%, rgba(10,123,229,.55), transparent 70%)','screen'], noite:['linear-gradient(180deg, rgba(13,58,133,0) 20%, rgba(13,58,133,.75))','multiply'], vinheta:['radial-gradient(110% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.45))','multiply'] };
const mkTx = (p) => { const t = TEXS[p.texturaExtra ?? p.textura ?? 'nenhuma']; return t ? { on: true, bg: t[0], bl: t[1], o: (p.texturaForca ?? 45) / 100 } : { on: false }; };
const mkGr = (p) => { const g = GRADS[p.gradiente ?? 'nenhum']; return g ? { on: true, bg: g[0], bl: g[1], o: (p.gradienteForca ?? 100) / 100 } : { on: false }; };
class Component extends DCLogic {
  renderVals() { const r = this.__rvBase(); return r && typeof r === 'object' ? { ...r, tx2: mkTx(this.props), gr2: mkGr(this.props) } : r; }
  driftRef = React.createRef();
  componentDidMount() { this.sync(); }
  componentDidUpdate() { this.sync(); }
  sync() {
    const el = this.driftRef.current; if (!el) return;
    if (this._a) { this._a.cancel(); this._a = null; }
    if (!this.props.animar) return;
    const tile = this._tile || 100;
    this._a = el.animate([{ transform: 'translateX(0)' }, { transform: `translateX(-${tile}px)` }], { duration: 4000 / (this.props.velocidade ?? 1), iterations: Infinity, easing: 'linear' });
  }
  __rvBase() {
    const p = this.props;
    const [W, H] = FMT[p.formato] || FMT['1:1'];
    const dw = p.largura ?? 360, esc = dw / W, dh = Math.round(H * esc);
    const el = p.elemento ?? 'cobogo';
    const bg = C[p.corFundo] || C.verde, fg = C[p.corPadrao] || C.vivo;
    const m = Math.min(W, H), sc = p.escala ?? 1;
    const mm = M[el];
    const v = { W, H, dw, dh, esc, bg, fg, op: p.opacidade ?? 1, rot: p.rotacao ?? 0, tx: { nenhuma: 0, sutil: .3, media: .6, forte: .95 }[p.textura ?? 'sutil'] ?? .3,
      isMask: !!mm, isAthos: el === 'athos', isBand: el === 'bandeirinhas', isFrevo: el === 'frevo' };
    v.tile = mm ? Math.round(m * mm[1] * sc) : Math.round(m * .125 * sc); v.url = mm ? mm[0] : ''; v.rep = mm ? mm[2] : 'repeat';
    this._tile = v.tile; v.driftRef = this.driftRef;
    const others = COLS.filter(c => c !== bg);
    if (el === 'athos') { const s = v.tile; v.tiles = []; for (let y = 0; y < Math.ceil(H / s); y++) for (let x = 0; x < Math.ceil(W / s); x++) { const k = (x * 7 + y * 13 + x * y) % 4; v.tiles.push({ x: x * s, y: y * s, s, r: k * 90, a: (x + y) % 3 === 0 ? others[0] : fg, b: (x + y) % 3 === 0 ? fg : others[0] }); } }
    if (el === 'bandeirinhas') { const fw = Math.round(m * .08 * sc), gap = Math.round(fw * .28), n = Math.ceil(W * 1.06 / (fw + gap)) + 1, step = fw * 2.2; v.rows = Array.from({ length: Math.ceil(H / step) }, (_, ri) => ({ top: Math.round(ri * step + fw * .3), rot: ri % 2 ? 1.5 : -1.5, gap, fw, fh: Math.round(fw * 1.25), flags: Array.from({ length: n }, (_, i) => others[(i + ri) % others.length]) })); }
    if (el === 'frevo') { const s = Math.round(m * .22 * sc), step = s * 1.3; v.umbs = []; for (let y = 0; y < Math.ceil(H / step) + 1; y++) for (let x = 0; x < Math.ceil(W / step) + 1; x++) v.umbs.push({ x: Math.round(x * step + (y % 2) * step / 2 - s / 2), y: Math.round(y * step - s / 2), s, b: Math.round(s * .03), b2: Math.round(s * .055) }); }
    return v;
  }
}
</script>
</body>
</html>
