    }
    if (anim === 'bolinhas') {
      const ds = Math.round(m * .16), gap = Math.round(ds * .35), st = ds + gap, cols = Math.ceil(W / st) + 1, rows = Math.ceil(H / st) + 1;
      v.ds = ds; v.dots = [];
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) v.dots.push({ x: x * st - gap, y: y * st - gap + (x % 2 ? st / 2 : 0), c: cs[(x + y) % cs.length], a: `lg_popw ${dur} ${dl((x + y) * .045)} ${ease} infinite both` });
    }
    if (anim === 'faixas') {
      const n = fmt === '16:9' ? 5 : 8, fbh = Math.round(H / (n * 1.5)), sp = H / n;
      Object.assign(v, { fbh, fcs: Math.round(fbh * .53), fct: Math.round(fbh * .235), fcr: Math.round(fbh * .37), fdw: Math.round(fbh * 1.75), fdr: Math.round(fbh * .9) });
      v.bars = Array.from({ length: n }, (_, i) => { const q = alt[i % alt.length]; const w = Math.round(W * (.55 + ((i * 37) % 40) / 100)); return { x: i % 2 ? W - w - m * .05 : m * .05, y: Math.round(i * sp + (sp - fbh) / 2), w, R: q.R === bg ? '#15E888' : q.R, D: q.D, C: q.C, a: `lg_wipe ${dur} ${dl(i * .07)} ${ease} infinite both` }; });
    }
    if (anim === 'mosaico') {
      const ms = Math.round(fmt === '16:9' ? W / 6 : W / 4), cols = Math.ceil(W / ms), rows = Math.ceil(H / ms), all = ['#0B5E37', '#15E888', '#FBF99D', '#0A7BE5', '#0D3A85', '#FFFFFF'];
      v.ms = ms; v.mtiles = [];
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const k = x + y * cols, b = all[(k * 2 + y) % all.length], f = all[(k * 2 + y + 3) % all.length], sh = (x * 3 + y * 2) % 3;
        const t = sh === 0 ? { l: ms * .22, t: ms * .22, w: ms * .56, h: ms * .56, br: '50%', clip: 'none' } : sh === 1 ? { l: ms * .08, t: ms * .21, w: ms * .84, h: ms * .58, br: '0', clip: 'polygon(0 50%,50% 0,100% 50%,50% 100%)' } : { l: 0, t: ms * .21, w: ms, h: ms * .58, br: '0', clip: 'none' };
        v.mtiles.push({ x: x * ms, y: y * ms, bg: b, fg: f, ...t, a: `lg_spin ${dur} ${dl((x + y) * .06)} ${ease} infinite both` });
      }
    }
    if (anim === 'recorte') {
      const rk = H * 1.5 / 174;
      Object.assign(v, { rk, rx: Math.round(W * .5 - 300 * rk), ry: Math.round((H - 174 * rk) / 2), aPan: `lg_pan ${(8 / vel).toFixed(1)}s ease-in-out infinite alternate` });
    }
    return v;
  }
}
