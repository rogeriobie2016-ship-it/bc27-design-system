<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="../css/fonts.css" rel="stylesheet">
<script src="../js/image-slot.js"></script>
</helmet>
<div style="position:relative;width:{{ dw }}px;height:{{ dh }}px;overflow:hidden;border-radius:4px">
<div style="position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale({{ esc }});transform-origin:0 0;overflow:hidden;background:{{ pal.bg }};font-family:'Bricolage Grotesque',sans-serif">

<sc-if value="{{ lCapa }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;right:0;top:0;width:760px;height:1080px;background:{{ pal.block }};overflow:hidden"><sc-if value="{{ eMask }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;background:{{ pal.bg }};mask:url({{ eUrl }}) 0 0/{{ eT }}px auto repeat"></div></sc-if></div>
<img src="../img/wm-{{ pal.wm }}.png" style="position:absolute;left:120px;top:110px;width:400px">
<div style="position:absolute;left:120px;top:300px;width:1000px;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:{{ cfs }}px;line-height:.9;letter-spacing:{{ trk }}em;color:{{ pal.ink }};text-wrap:balance">{{ titulo }}</div>
<div style="position:absolute;left:120px;bottom:110px;font-weight:600;font-size:34px;letter-spacing:.14em;color:{{ pal.kick }}">{{ subtitulo }}</div>
</sc-if>

<sc-if value="{{ lDivisor }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:0;width:100%;height:220px;overflow:hidden"><sc-if value="{{ eMask }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;background:{{ pal.pat }};mask:url({{ eUrl }}) 0 0/{{ eT }}px auto repeat"></div></sc-if></div>
<div style="position:absolute;left:110px;top:250px;font-weight:800;font-stretch:{{ larg }}%;font-size:600px;line-height:.85;letter-spacing:-.06em;color:{{ pal.block }}">{{ numero }}</div>
<div style="position:absolute;left:980px;right:120px;top:420px;display:flex;flex-direction:column;gap:24px"><span style="font-weight:700;font-size:30px;letter-spacing:.2em;color:{{ pal.kick }}">{{ subtitulo }}</span><span style="font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:130px;line-height:.9;letter-spacing:{{ trk }}em;color:{{ pal.ink }};text-wrap:balance">{{ titulo }}</span></div>
</sc-if>

<sc-if value="{{ lConteudo }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:120px;top:110px;font-weight:700;font-size:28px;letter-spacing:.2em;color:{{ pal.kick }}">{{ subtitulo }}</div>
<div style="position:absolute;left:120px;top:170px;width:820px;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:100px;line-height:.94;letter-spacing:{{ trk }}em;color:{{ pal.block }};text-wrap:balance">{{ titulo }}</div>
<div style="position:absolute;left:120px;top:600px;width:780px;font-weight:400;font-size:34px;line-height:1.45;color:{{ pal.ink }};text-wrap:pretty">{{ texto }}</div>
<div style="position:absolute;left:1040px;top:110px;width:760px;height:830px">
<sc-if value="{{ mSelo }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:radial-gradient(circle at 12px 12px,transparent 8px,#FFFFFF 8.5px) -12px -12px/24px 24px;filter:drop-shadow(0 16px 20px rgba(0,0,0,.18))"></div></sc-if>
<div style="position:absolute;inset:{{ phIn }}px;border-radius:{{ phR }};overflow:hidden;background:#FFFFFF"><image-slot id="{{ slotId }}" shape="rect" src="../img/fotos/fernanda.jpg" placeholder="Imagem do slide"></image-slot></div>
</div>
</sc-if>

<sc-if value="{{ lCitacao }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:110px;top:40px;font-weight:800;font-size:560px;line-height:.8;color:{{ pal.pat }}">“</div>
<div style="position:absolute;left:120px;right:200px;top:330px;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:96px;line-height:1.02;letter-spacing:{{ trk }}em;color:{{ pal.block }};text-wrap:pretty">{{ titulo }}</div>
<div style="position:absolute;left:120px;bottom:130px;display:flex;align-items:center;gap:22px"><div style="width:80px;height:10px;background:{{ pal.pat }}"></div><span style="font-weight:700;font-size:34px;color:{{ pal.ink }}">{{ subtitulo }}</span></div>
</sc-if>

<sc-if value="{{ lNumeros }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:120px;top:110px;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:90px;line-height:.95;letter-spacing:{{ trk }}em;color:{{ pal.ink }}">{{ titulo }}</div>
<div style="position:absolute;left:120px;right:120px;top:340px;display:grid;grid-template-columns:repeat(3,1fr);gap:40px">
<sc-for list="{{ nums }}" as="n" hint-placeholder-count="3"><div style="background:{{ n.bg }};padding:50px 44px;display:flex;flex-direction:column;gap:16px;height:520px;box-sizing:border-box;justify-content:flex-end"><span style="font-weight:800;font-stretch:{{ larg }}%;font-size:180px;line-height:.85;letter-spacing:-.05em;color:{{ n.fg }}">{{ n.v }}</span><span style="font-weight:600;font-size:34px;line-height:1.2;color:{{ n.fg }}">{{ n.l }}</span></div></sc-for>
</div>
</sc-if>

<sc-if value="{{ lAgenda }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:0;width:560px;height:1080px;background:{{ pal.block }};overflow:hidden"><sc-if value="{{ eMask }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;background:{{ pal.bg }};opacity:.9;mask:url({{ eUrl }}) 0 0/{{ eT }}px auto repeat"></div></sc-if><div style="position:absolute;left:80px;bottom:90px;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:120px;line-height:.9;letter-spacing:{{ trk }}em;color:{{ pal.title }};background:{{ pal.block }};padding:10px 20px 20px 0">{{ titulo }}</div></div>
<div style="position:absolute;left:660px;right:120px;top:130px;display:flex;flex-direction:column">
<sc-for list="{{ itens }}" as="a" hint-placeholder-count="5"><div style="display:flex;align-items:baseline;gap:40px;padding:30px 0;border-bottom:3px solid {{ pal.line }}"><span style="flex:none;width:180px;font-weight:800;font-size:54px;letter-spacing:-.02em;color:{{ pal.kick }}">{{ a.h }}</span><span style="font-weight:700;font-size:48px;line-height:1.1;color:{{ pal.ink }}">{{ a.t }}</span></div></sc-for>
</div>
</sc-if>

<sc-if value="{{ lPalestrante }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:120px;top:140px;width:720px;height:800px;border-radius:360px 360px 0 0;overflow:hidden;background:#FFFFFF;box-shadow:0 0 0 18px {{ pal.block }}"><image-slot id="{{ slotId }}" shape="rect" src="../img/fotos/lana.jpg" placeholder="Foto do palestrante"></image-slot></div>
<div style="position:absolute;left:980px;right:120px;top:300px;display:flex;flex-direction:column;gap:28px;align-items:flex-start"><span style="font-weight:700;font-size:30px;letter-spacing:.2em;color:{{ pal.kick }}">{{ subtitulo }}</span><span style="font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:130px;line-height:.9;letter-spacing:{{ trk }}em;color:{{ pal.block }}">{{ titulo }}</span><span style="font-weight:400;font-size:34px;line-height:1.45;color:{{ pal.ink }};text-wrap:pretty">{{ texto }}</span></div>
</sc-if>

<sc-if value="{{ lEncerramento }}" hint-placeholder-val="{{ false }}">
<sc-if value="{{ eMask }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;background:{{ pal.pat }};opacity:.45;mask:url({{ eUrl }}) 0 0/{{ eT }}px auto repeat"></div></sc-if>
<div style="position:absolute;left:0;top:360px;width:100%;height:360px;background:{{ pal.block }}"></div>
<div style="position:absolute;left:0;right:0;top:420px;text-align:center;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:220px;line-height:1;letter-spacing:{{ trk }}em;color:{{ pal.title }}">{{ titulo }}</div>
<div style="position:absolute;left:0;right:0;top:780px;text-align:center;font-weight:600;font-size:36px;letter-spacing:.14em;color:{{ pal.ink }}">{{ subtitulo }}</div>
<img src="../img/wm-{{ pal.wm }}.png" style="position:absolute;left:760px;top:190px;width:400px">
</sc-if>

<sc-if value="{{ rodape }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:0;bottom:0;width:100%;height:16px;display:flex"><div style="flex:1;background:#0B5E37"></div><div style="flex:1;background:#15E888"></div><div style="flex:1;background:#FBF99D"></div><div style="flex:1;background:#0A7BE5"></div></div><sc-if value="{{ wmFoot }}" hint-placeholder-val="{{ true }}"><img src="../img/wm-{{ pal.wm }}.png" style="position:absolute;right:120px;bottom:60px;width:260px"></sc-if><span style="position:absolute;left:120px;bottom:58px;font-weight:700;font-size:22px;letter-spacing:.14em;color:{{ pal.kick }}">{{ pagina }}</span></sc-if>
<div style="position:absolute;inset:0;background:url(../img/papel.png) 0 0/700px,url(../img/grao.png) 0 0/300px;opacity:{{ tx }};pointer-events:none"></div><sc-if value="{{ gr2.on }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:{{ gr2.bg }};mix-blend-mode:{{ gr2.bl }};opacity:{{ gr2.o }};pointer-events:none"></div></sc-if><sc-if value="{{ tx2.on }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:{{ tx2.bg }};mix-blend-mode:{{ tx2.bl }};opacity:{{ tx2.o }};pointer-events:none"></div></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:576,&quot;height&quot;:324},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;capa&quot;,&quot;divisor&quot;,&quot;conteudo&quot;,&quot;citacao&quot;,&quot;numeros&quot;,&quot;agenda&quot;,&quot;palestrante&quot;,&quot;encerramento&quot;],&quot;default&quot;:&quot;capa&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;paleta&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;verde&quot;,&quot;amarelo&quot;,&quot;noite&quot;,&quot;papel&quot;,&quot;azul&quot;,&quot;branco&quot;],&quot;default&quot;:&quot;verde&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;elemento&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cobogo&quot;,&quot;azulejo&quot;,&quot;calcadao&quot;,&quot;fuxico&quot;,&quot;hachura&quot;,&quot;ondas&quot;,&quot;estrelas&quot;,&quot;alvorada&quot;,&quot;nenhum&quot;],&quot;default&quot;:&quot;cobogo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;moldura&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;selo&quot;,&quot;arco&quot;,&quot;circulo&quot;,&quot;retangulo&quot;],&quot;default&quot;:&quot;selo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;rodape&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;titulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texto&quot;},&quot;subtitulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texto&quot;},&quot;texto&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Espaço para o conteúdo do slide.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texto&quot;},&quot;numero&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texto&quot;},&quot;pagina&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;BC27 · 03&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Texto&quot;},&quot;caixa&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;alta&quot;,&quot;como digitado&quot;,&quot;baixa&quot;],&quot;default&quot;:&quot;alta&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tipografia&quot;},&quot;peso&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:300,&quot;max&quot;:800,&quot;step&quot;:100,&quot;default&quot;:800,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Tipografia&quot;},&quot;larguraFonte&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:75,&quot;max&quot;:100,&quot;step&quot;:5,&quot;default&quot;:100,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Tipografia&quot;},&quot;tracking&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:-8,&quot;max&quot;:8,&quot;step&quot;:1,&quot;default&quot;:-3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Tipografia&quot;},&quot;textura&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhuma&quot;,&quot;sutil&quot;,&quot;media&quot;,&quot;forte&quot;],&quot;default&quot;:&quot;media&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Visual&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;sl3&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Saída&quot;},&quot;largura&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:576,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Saída&quot;},&quot;texturaExtra&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhuma&quot;,&quot;ruído&quot;,&quot;ruído forte&quot;,&quot;papel&quot;,&quot;papel + ruído&quot;,&quot;meio-tom&quot;,&quot;linho&quot;,&quot;linhas de tv&quot;],&quot;default&quot;:&quot;nenhuma&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Textura e gradiente&quot;},&quot;texturaForca&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;default&quot;:45,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Textura e gradiente&quot;},&quot;gradiente&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhum&quot;,&quot;luz suave&quot;,&quot;profundidade&quot;,&quot;brilho dourado&quot;,&quot;mata para céu&quot;,&quot;aurora&quot;,&quot;noite&quot;,&quot;vinheta&quot;],&quot;default&quot;:&quot;nenhum&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Textura e gradiente&quot;},&quot;gradienteForca&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;default&quot;:100,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Textura e gradiente&quot;}}">
const PAL = {
  verde:   { bg:'#0B5E37', pat:'#1A8A52', block:'#15E888', title:'#0B5E37', kick:'#15E888', ink:'#FFFFFF', wm:'amarelo', line:'#1A8A52' },
  amarelo: { bg:'#FBF99D', pat:'#0A7BE5', block:'#0B5E37', title:'#FBF99D', kick:'#0A7BE5', ink:'#0D3A85', wm:'navy', line:'#EDE77E' },
  noite:   { bg:'#0D3A85', pat:'#0A7BE5', block:'#FBF99D', title:'#0D3A85', kick:'#15E888', ink:'#FFFFFF', wm:'amarelo', line:'#1A4A9E' },
  papel:   { bg:'#F5F4EC', pat:'#0A7BE5', block:'#0B5E37', title:'#F5F4EC', kick:'#0A7BE5', ink:'#0D3A85', wm:'verde', line:'#E4E2D6' },
  azul:    { bg:'#0A7BE5', pat:'#FBF99D', block:'#FBF99D', title:'#0D3A85', kick:'#FBF99D', ink:'#FFFFFF', wm:'branco', line:'#3A93EA' },
  branco:  { bg:'#FFFFFF', pat:'#15E888', block:'#0D3A85', title:'#FFFFFF', kick:'#0A7BE5', ink:'#0D3A85', wm:'navy', line:'#E4E2D6' },
};
const EL = { cobogo:['../img/f2/cobogo.svg',160], azulejo:['../img/f2/azulejo.svg',170], calcadao:['../img/f2/calcadao.svg',320], fuxico:['../img/f2/fuxico.svg',150], hachura:['../img/f2/hachura.svg',90], ondas:['../img/f/onda-linha.svg',220], estrelas:['../img/f/estrela8.svg',120], alvorada:['../img/f2/alvorada.svg',160] };
const DEF = {
  capa:['O Brasil em primeira pessoa','HARVARD & MIT · CAMBRIDGE, MA · 2027'], divisor:['Identidade','CAPÍTULO'], conteudo:['O país contado por quem o vive','01 · IDENTIDADE'],
  citacao:['Quem conta a história do Brasil é quem vive o Brasil todos os dias.','Fernanda Torres · Impacto Social'], numeros:['A BC em números',''], agenda:['Agenda',''],
  palestrante:['Fernanda Torres','PALESTRANTE'], encerramento:['Obrigado!','BRAZILCONFERENCE.ORG · #BC27'],
};
const TEXS = { ruído:['url(../img/grao.png) 0 0/420px 420px repeat','overlay'], 'ruído forte':['url(../img/grao.png) 0 0/220px 220px repeat','multiply'], papel:['url(../img/papel.png) center/cover','multiply'], 'meio-tom':['radial-gradient(rgba(0,0,0,.55) 1.3px, transparent 1.8px) 0 0/11px 11px','soft-light'], linho:['repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 1px, transparent 1px 4px)','overlay'], 'linhas de tv':['repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 2px, transparent 2px 6px)','multiply'], 'papel + ruído':['url(../img/grao.png) 0 0/320px 320px repeat, url(../img/papel.png) center/cover','multiply'] };
const GRADS = { 'luz suave':['radial-gradient(120% 80% at 15% 0%, rgba(255,255,255,.45), transparent 62%)','soft-light'], profundidade:['linear-gradient(180deg, transparent 35%, rgba(0,0,0,.5))','multiply'], 'brilho dourado':['radial-gradient(90% 70% at 85% 8%, rgba(251,249,157,.6), transparent 65%)','screen'], 'mata para céu':['linear-gradient(160deg, rgba(21,232,136,.5), rgba(10,123,229,.5))','overlay'], aurora:['radial-gradient(60% 50% at 18% 82%, rgba(21,232,136,.55), transparent 70%), radial-gradient(60% 50% at 82% 18%, rgba(10,123,229,.55), transparent 70%)','screen'], noite:['linear-gradient(180deg, rgba(13,58,133,0) 20%, rgba(13,58,133,.75))','multiply'], vinheta:['radial-gradient(110% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.45))','multiply'] };
const mkTx = (p) => { const t = TEXS[p.texturaExtra ?? p.textura ?? 'nenhuma']; return t ? { on: true, bg: t[0], bl: t[1], o: (p.texturaForca ?? 45) / 100 } : { on: false }; };
const mkGr = (p) => { const g = GRADS[p.gradiente ?? 'nenhum']; return g ? { on: true, bg: g[0], bl: g[1], o: (p.gradienteForca ?? 100) / 100 } : { on: false }; };
class Component extends DCLogic {
  renderVals() { const r = this.__rvBase(); return r && typeof r === 'object' ? { ...r, tx2: mkTx(this.props), gr2: mkGr(this.props) } : r; }
  __rvBase() {
    const p = this.props;
    const L = DEF[p.layout] ? p.layout : 'capa';
    const pal = PAL[p.paleta] || PAL.verde;
    const E = EL[p.elemento ?? 'cobogo'];
    const cx = p.caixa ?? 'alta';
    const tr = (s) => cx === 'alta' ? s.toUpperCase() : cx === 'baixa' ? s.toLowerCase() : s;
    const larg = p.larguraFonte ?? 100, wf = 0.78 + 0.22 * (larg - 75) / 25;
    const titulo = tr(p.titulo || DEF[L][0]);
    const words = titulo.split(' '), longest = Math.max(...words.map(w => w.length));
    const dw = p.largura ?? 576, mold = p.moldura ?? 'selo';
    const cols = [[pal.block, pal.title], ['#FFFFFF', '#0D3A85'], ['#0A7BE5', '#FFFFFF']];
    return {  dw, dh: Math.round(dw * 1080 / 1920), esc: dw / 1920, pal, titulo, subtitulo: p.subtitulo || DEF[L][1], texto: p.texto ?? 'Espaço para o conteúdo do slide. Texto corrido em Bricolage 400, 32–36px, no máximo três parágrafos curtos por tela.',
      numero: p.numero ?? '01', pagina: p.pagina ?? 'BC27 · 03', peso: p.peso ?? 800, larg, trk: (p.tracking ?? -3) / 100,
      cfs: Math.round(Math.min(170, 1000 / (longest * .62 * wf))),
      lCapa: L === 'capa', lDivisor: L === 'divisor', lConteudo: L === 'conteudo', lCitacao: L === 'citacao', lNumeros: L === 'numeros', lAgenda: L === 'agenda', lPalestrante: L === 'palestrante', lEncerramento: L === 'encerramento',
      eMask: !!E, eUrl: E ? E[0] : '', eT: E ? E[1] : 0,
      mSelo: mold === 'selo', phIn: mold === 'selo' ? 24 : 0, phR: mold === 'arco' ? '380px 380px 0 0' : mold === 'circulo' ? '50%' : '0',
      nums: [['14', 'anos de Brazil Conference'], ['+5 mil', 'pessoas por edição'], ['27', 'estados representados']].map((n, i) => ({ v: n[0], l: n[1], bg: cols[i][0], fg: cols[i][1] })),
      itens: [['09h', 'Abertura · O Brasil em primeira pessoa'], ['10h30', 'Painel · Identidade que impulsiona'], ['13h', 'Almoço e networking'], ['14h', 'Fala BC! · Vozes das regiões'], ['17h', 'Encerramento']].map(a => ({ h: a[0], t: a[1] })),
      rodape: (p.rodape ?? true) && L !== 'capa' && L !== 'encerramento', wmFoot: L !== 'agenda',
      tx: { nenhuma: 0, sutil: .3, media: .6, forte: .95 }[p.textura ?? 'media'] ?? .6, slotId: p.slotId ?? 'sl3' };
  }
}
