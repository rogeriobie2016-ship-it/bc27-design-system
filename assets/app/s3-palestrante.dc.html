<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="../css/fonts.css" rel="stylesheet">
<script src="../js/image-slot.js"></script>
</helmet>
<div style="position:relative;width:{{ dw }}px;height:{{ dh }}px;overflow:hidden;border-radius:6px">

<sc-if value="{{ lCapa }}" hint-placeholder-val="{{ true }}">

<div style="position:absolute;inset:{{ phIn }}px;border-radius:{{ phR }};clip-path:{{ phClip }};overflow:hidden;background:#FFFFFF;box-shadow:0 0 0 {{ phB }}px {{ pal.block }}"><image-slot id="{{ slotId }}" shape="rect" src="../img/fotos/fernanda.jpg" placeholder="Foto do palestrante"></image-slot></div>
</div>
<div style="position:absolute;left:0;right:0;top:{{ nY }}px;display:flex;flex-direction:column;align-items:center;gap:14px">
<div style="background:{{ pal.block }};padding:10px 44px 18px;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:{{ nfs }}px;letter-spacing:{{ trk }}em;line-height:1;color:{{ pal.title }};white-space:nowrap">{{ nome }}</div>
<div style="background:#FFFFFF;padding:12px 30px;font-weight:600;font-stretch:{{ larg }}%;font-size:{{ rfs }}px;color:#0D3A85;white-space:nowrap">{{ cargo }}</div>
<div style="font-weight:600;font-size:{{ efs }}px;letter-spacing:.16em;color:{{ pal.ink }}">{{ empresa }}</div>
</div>
</sc-if>

<sc-if value="{{ lBio }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;right:{{ padX }}px;top:{{ kY }}px;font-weight:700;font-size:{{ kfs }}px;letter-spacing:.16em;color:{{ pal.kick }}">{{ pagina }}</div>
<div style="position:absolute;left:{{ padX }}px;top:{{ hY }}px;display:flex;align-items:center;gap:{{ hGap }}px">

</div>
<div style="position:absolute;left:{{ padX }}px;right:{{ padX }}px;top:{{ bY }}px;font-weight:500;font-stretch:{{ larg }}%;font-size:{{ bfs }}px;line-height:1.32;color:{{ pal.ink }};text-wrap:pretty">{{ bio }}</div>

</sc-if>

<sc-if value="{{ lPainel }}" hint-placeholder-val="{{ false }}">

</div>

<sc-if value="{{ lLineup }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:{{ padX }}px;top:{{ kY }}px;font-weight:{{ peso }};font-stretch:{{ larg }}%;font-size:{{ lufs }}px;line-height:.9;letter-spacing:{{ trk }}em;color:{{ pal.block }}">{{ kicker }}</div>

</div>
</sc-if>

<sc-if value="{{ assinatura }}" hint-placeholder-val="{{ true }}"><img src="../img/wm-{{ pal.wm }}.png" style="position:absolute;left:{{ wmX }}px;top:{{ wmY }}px;width:{{ wmW }}px"></sc-if>
<div style="position:absolute;inset:0;background:url(../img/papel.png) 0 0/700px,url(../img/grao.png) 0 0/300px;opacity:{{ tx }};pointer-events:none"></div><sc-if value="{{ gr2.on }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:{{ gr2.bg }};mix-blend-mode:{{ gr2.bl }};opacity:{{ gr2.o }};pointer-events:none"></div></sc-if><sc-if value="{{ tx2.on }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:{{ tx2.bg }};mix-blend-mode:{{ tx2.bl }};opacity:{{ tx2.o }};pointer-events:none"></div></sc-if>
</div>
</div>
</x-dc>

ep&quot;:5,&quot;default&quot;:100,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Tipografia&quot;},&quot;tracking&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:-8,&quot;max&quot;:8,&quot;step&quot;:1,&quot;default&quot;:-3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Tipografia&quot;},&quot;assinatura&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Visual&quot;},&quot;textura&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhuma&quot;,&quot;sutil&quot;,&quot;media&quot;,&quot;forte&quot;],&quot;default&quot;:&quot;media&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Visual&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;pal3&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Saída&quot;},&quot;largura&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:288,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Saída&quot;},&quot;texturaExtra&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhuma&quot;,&quot;ruído&quot;,&quot;ruído forte&quot;,&quot;papel&quot;,&quot;papel + ruído&quot;,&quot;meio-tom&quot;,&quot;linho&quot;,&quot;linhas de tv&quot;],&quot;default&quot;:&quot;nenhuma&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Textura e gradiente&quot;},&quot;texturaForca&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;default&quot;:45,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Textura e gradiente&quot;},&quot;gradiente&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhum&quot;,&quot;luz suave&quot;,&quot;profundidade&quot;,&quot;brilho dourado&quot;,&quot;mata para céu&quot;,&quot;aurora&quot;,&
